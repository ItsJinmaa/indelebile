[project]
name = "indelebile"
version = "0.1.0"
description = "Indélébile : les arcanes de la preuve. Service de notarisation multi-agents (Notaria, sujet 8)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Antoine Francoz" }]
dependencies = [
    "cryptography>=43",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indelebile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["indelebile"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
